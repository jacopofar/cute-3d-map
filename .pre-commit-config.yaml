repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.86
    hooks:
      - id: ty
        # the Python project lives in tilegen/, so point ty at its pyproject
        # and venv (run `uv sync --group dev` there first)
        args: [--project, tilegen]
