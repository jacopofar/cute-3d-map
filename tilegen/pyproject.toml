[project]
name = "tilegen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "duckdb>=1.5.6",
    # may require many system packages to be installed
    # (e.g. sudo dnf install gdal-devel proj-devel libarrow-glib-devel libarrow-dataset-devel libarrow-dataset-libs libarrow-flight-devel)
    "pillow>=13.0.0",
    "quackosm>=0.19.0",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
    "types-shapely>=2.1.0.20260728",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# coverage is on by default so `uv run pytest` reports it every time
addopts = "--cov=features --cov=geo --cov=gtfs --cov=impute --cov=lamps --cov=main --cov=parking --cov=sidewalks --cov=tile_inspector --cov=traffic --cov-report=term-missing"

[tool.coverage.run]
# the DuckDB/PBF I/O in main.py is not unit-tested; the pure logic is
source = [
    "features",
    "geo",
    "gtfs",
    "impute",
    "lamps",
    "main",
    "parking",
    "sidewalks",
    "tile_inspector",
    "traffic",
]

[tool.coverage.report]
# a floor, not a goal: keep the pure modules covered while main.py's I/O shell
# stays untested
fail_under = 80
